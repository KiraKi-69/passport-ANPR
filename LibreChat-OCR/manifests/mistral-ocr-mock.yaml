apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral-ocr-mock
  namespace: ocr-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mistral-ocr-mock
  template:
    metadata:
      labels:
        app: mistral-ocr-mock
    spec:
      containers:
        - name: mock
          image: ваш-образ/mistral-ocr-mock:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mistral-ocr-mock
  namespace: ocr-service
spec:
  selector:
    app: mistral-ocr-mock
  ports:
    - port: 8000
      targetPort: 8000