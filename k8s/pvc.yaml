apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ls-media-pvc
  namespace: app-demoproj
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: lhrwm
  volumeMode: Filesystem
